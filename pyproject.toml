[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniflight"
version = "0.6.0"
description = "Milestone F sampled-data GNC and robustness layer for a celestial-body-agnostic hybrid flight dynamics engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13"]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Unified Flight Dynamics project"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
