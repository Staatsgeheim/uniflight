[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniflight"
version = "1.0.3"
description = "Planet-agnostic 3/6-DOF research flight-dynamics engine with missions, plugins, campaign analysis, formal verification, and a FastMCP server"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "PyYAML>=6.0"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Unified Flight Dynamics project"}]
keywords = [
  "flight-dynamics",
  "6dof",
  "simulation",
  "gnc",
  "trajectory",
  "aerospace",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Staatsgeheim/uniflight"
Repository = "https://github.com/Staatsgeheim/uniflight"
Issues = "https://github.com/Staatsgeheim/uniflight/issues"

[project.optional-dependencies]
mcp = [
  "fastmcp[tasks]>=3.4.7,<4",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "jsonschema>=4.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "fastmcp[tasks]>=3.4.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.scripts]
uniflight-mission = "uniflight.mission_cli:main"
uniflight-analysis = "uniflight.analysis_cli:main"
uniflight-verify = "uniflight.verify_cli:main"
uniflight-mcp = "uniflight_mcp.server:main"


[tool.coverage.run]
branch = true
source = ["uniflight"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Start CI enforcement with correctness-oriented rules. The historical style/
# unused-import backlog can be tightened incrementally without blocking safety fixes.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
