[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uniflight"
version = "0.12.0"
description = "Milestone L declarative mission definition language for a POST2-class research flight dynamics engine"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "PyYAML>=6.0"]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Unified Flight Dynamics project"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.scripts]
uniflight-mission = "uniflight.mission_cli:main"
